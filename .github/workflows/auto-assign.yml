name: 🥋 Auto Assign

on:
  pull_request:
    types: [opened, reopened]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 🥋 Chuck Norris assigns himself. So does @mwilde.
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: ['mwilde']
            });
            // Skip reviewer request if the PR author is mwilde (can't review own PR)
            if (context.payload.pull_request.user.login !== 'mwilde') {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: ['mwilde']
              });
            }
