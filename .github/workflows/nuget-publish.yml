name: 🚀 Publish to NuGet

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      NBGV_CloudBuildAllVars: false

    steps:
      - name: 🥋 Chuck Norris doesn't check out code. Code checks itself out.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 🔨 Build
        run: |
          dotnet build src/ChuckNorris.Extensions/ChuckNorris.Extensions.csproj --configuration Release
          dotnet build src/ChuckNorris.Extensions.Blazor/ChuckNorris.Extensions.Blazor.csproj --configuration Release
          dotnet build tests/ChuckNorris.Extensions.Tests/ChuckNorris.Extensions.Tests.csproj --configuration Release

      - name: ✅ Test — they all pass. They wouldn't dare fail.
        run: dotnet run --project tests/ChuckNorris.Extensions.Tests/ChuckNorris.Extensions.Tests.csproj --configuration Release --no-build

      - name: 📦 Pack
        run: |
          dotnet pack src/ChuckNorris.Extensions/ChuckNorris.Extensions.csproj --configuration Release --no-build --output ./nupkg
          dotnet pack src/ChuckNorris.Extensions.Blazor/ChuckNorris.Extensions.Blazor.csproj --configuration Release --no-build --output ./nupkg

      - name: 🚀 Push to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
